[package]
name = "solonka"
version = "1.0.1"
edition = "2024"
description = "Счётчик русского мата для стримов: трей, офлайн-распознавание речи, вывод в OBS"
license = "MIT"
repository = "https://github.com/denprog5/solonka"
publish = false

[dependencies]
base64 = "0.23.1"
cpal = "0.18.2"
rtrb = "0.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sherpa-onnx = "2.0.1"
tray-icon = "0.26.1"
tungstenite = "0.30.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Registry", "Win32_Networking_WinHttp"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
embed-resource = "3.0.12"
